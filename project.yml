name: iVidigotchi
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: S769436W24
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  iVidigotchi:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - target: iVidigotchiWidget
    entitlements:
      path: Config/iVidigotchi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ividi.ividigotchi
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: Config/Info-iOS.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleDisplayName: iVidigotchi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.simulation-games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividigotchi
        PRODUCT_NAME: iVidigotchi
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  iVidigotchiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Core
      - path: Sources/Localization
      - path: Sources/Theme/Palette.swift
      - path: Sources/Scenes/PetRenderer.swift
      - path: Sources/Scenes/PetRenderer+Face.swift
    entitlements:
      path: Config/iVidigotchiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ividi.ividigotchi
    info:
      path: Config/Info-Widget.plist
      properties:
        CFBundleDisplayName: iVidigotchi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividigotchi.widget
        PRODUCT_NAME: iVidigotchiWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  iVidigotchiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: iVidigotchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividigotchi.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iVidigotchi.app/iVidigotchi
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  iVidigotchi:
    build:
      targets:
        iVidigotchi: all
        iVidigotchiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iVidigotchiTests
