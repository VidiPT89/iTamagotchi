name: iTamagotchi
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: S769436W24
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  iTamagotchi:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - target: iTamagotchiWidget
    entitlements:
      path: Config/iTamagotchi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ividi.itamagotchi
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: Config/Info-iOS.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleDisplayName: iTamagotchi
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.simulation-games
        NSHumanReadableCopyright: Copyright © David Arsénio Martins
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.itamagotchi
        PRODUCT_NAME: iTamagotchi
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  iTamagotchiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Core
      - path: Sources/Localization
      - path: Sources/Theme/Palette.swift
      - path: Sources/Scenes/PetRenderer.swift
      - path: Sources/Scenes/PetRenderer+Face.swift
    entitlements:
      path: Config/iTamagotchiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ividi.itamagotchi
    info:
      path: Config/Info-Widget.plist
      properties:
        CFBundleDisplayName: iTamagotchi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.itamagotchi.widget
        PRODUCT_NAME: iTamagotchiWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  iTamagotchiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: iTamagotchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.itamagotchi.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iTamagotchi.app/iTamagotchi
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  iTamagotchi:
    build:
      targets:
        iTamagotchi: all
        iTamagotchiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iTamagotchiTests
